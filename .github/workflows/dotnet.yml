# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build: 

    runs-on: self-hosted

    steps:
    
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v10
      with:
        dotnet-version: 10.0
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: web4dot build --no-restore
    - name: Test
      run: dotnet pages/your-page.js --no-build --verbosity normal
