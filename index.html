<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Documentation</title>
  
  <!-- Prism Syntax Highlighting -->
  <link rel="stylesheet" href="https://unpkg.com/prismjs/themes/prism-tomorrow.css" />
  <script src="https://unpkg.com/prismjs/prism.js"></script>

  <style>
    :root {
      --aura-glow: 0.5;
      --aura-light: hsl(190, 100%, 65%);
      --aura-dark: hsl(270, 100%, 70%);
      --bg: #0d0d0d;
      --fg: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    aside {
      width: 260px;
      background: rgba(20, 20, 20, 0.95);
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2rem 1rem;
      position: relative;
    }

    aside h2 {
      color: var(--aura-light);
      font-weight: 700;
      text-align: center;
      margin-top: 0;
    }

    aside nav a {
      display: block;
      padding: 0.7rem 1rem;
      color: #aaa;
      text-decoration: none;
      border-radius: 8px;
      margin: 0.3rem 0;
      transition: background 0.3s, color 0.3s;
      cursor: pointer;
    }

    aside nav a:hover,
    aside nav a.active {
      background: linear-gradient(90deg, var(--aura-light), var(--aura-dark));
      color: white;
    }

    main {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
      position: relative;
    }

    .aura-title {
      font-size: 2.2rem;
      background: linear-gradient(90deg, var(--aura-light), var(--aura-dark));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px var(--aura-dark);
      margin-top: 0;
    }

    pre {
      background: rgba(255, 255, 255, 0.05) !important;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
    }

    /* Voice button */
    #voice-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--aura-light), var(--aura-dark));
      box-shadow: 0 0 20px var(--aura-dark);
      cursor: pointer;
      color: white;
      font-size: 1.5rem;
      transition: transform 0.2s ease;
      z-index: 1000;
    }

    #voice-btn.listening {
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px var(--aura-light);
      }
      50% {
        transform: scale(1.1);
        box-shadow: 0 0 25px var(--aura-dark);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 15px var(--aura-light);
      }
    }

    footer {
      text-align: center;
      opacity: 0.5;
      margin-top: 2rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <aside>
    <h2>Aura</h2>
    <nav id="sidebar-nav">
      <a data-section="intro" onclick="loadSection('intro', event)" class="active">Introduction</a>
      <a data-section="voice" onclick="loadSection('voice', event)">Voice Integration</a>
      <a data-section="api" onclick="loadSection('api', event)">API Reference</a>
      <a data-section="examples" onclick="loadSection('examples', event)">Examples</a>
    </nav>
  </aside>

  <main id="content">
    <h1 class="aura-title">Aura Documentation</h1>
    <p>Welcome to <strong>Aura</strong> — the next evolution of voice-reactive intelligence. Speak, and the docs respond.</p>
    <pre><code class="language-js">// Try saying "Show me voice integration"
console.log("Hello Aura");</code></pre>
  </main>

  <button id="voice-btn" title="Activate Voice Assistant">🎤</button>

  <script>
    const content = document.getElementById("content");
    
    const sections = {
      intro: `
        <h1 class="aura-title">Introduction</h1>
        <p>Aura is a <b>Voice Reactive Intelligence Engine</b> that combines speech recognition, context memory, and real-time code generation.</p>
        <pre><code class="language-js">// Initialize Aura Engine
const aura = new Aura({ glow: 0.5 });
aura.start();</code></pre>
      `,
      voice: `
        <h1 class="aura-title">Voice Integration</h1>
        <p>To enable voice interactivity, Aura uses the <code>SpeechRecognition</code> API and Web Speech Synthesis.</p>
        <pre><code class="language-js">const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
recognition.start();</code></pre>
      `,
      api: `
        <h1 class="aura-title">API Reference</h1>
        <p>Aura exposes a modular API for voice, emotion, and action layers.</p>
        <pre><code class="language-js">fetch("/api/v1/voice", { 
  method: "POST", 
  body: audioBlob 
});</code></pre>
      `,
      examples: `
        <h1 class="aura-title">Examples</h1>
        <p>Here’s how you can trigger a reactive event:</p>
        <pre><code class="language-js">aura.on("command", (cmd) => {
  if (cmd.includes("hello")) aura.say("Hey there, human!"); 
});</code></pre> 
      ` 
    };

    function loadSection(sectionKey, evt) {
      if (!sections[sectionKey]) return;

      content.innerHTML = sections[sectionKey];
      Prism.highlightAll();
      
      // Update sidebar nav active state
      document.querySelectorAll("#sidebar-nav a").forEach(a => a.classList.remove("active"));
      
      if (evt && evt.target) {
        evt.target.classList.add("active");
      } else {
        const targetLink = document.querySelector(`#sidebar-nav a[data-section="${sectionKey}"]`);
        if (targetLink) targetLink.classList.add("active");
      }
    }

    // Prism initial highlight on page load
    window.addEventListener("DOMContentLoaded", () => {
      Prism.highlightAll();
    });

    // Voice assistant setup
    const btn = document.getElementById("voice-btn");
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const synth = window.speechSynthesis;
      const rec = new SpeechRecognition();
      rec.continuous = false;
      rec.lang = "en-US";

      let availableVoices = [];
      const updateVoices = () => {
        availableVoices = synth.getVoices();
      };
      updateVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = updateVoices;
      }

      rec.onresult = (e) => {
        const transcript = e.results[0][0].transcript.toLowerCase();
        
        if (transcript.includes("voice")) {
          speak("Showing voice integration.");
          loadSection("voice");
        } else if (transcript.includes("api")) {
          speak("Showing API reference.");
          loadSection("api");
        } else if (transcript.includes("example")) {
          speak("Showing examples.");
          loadSection("examples");
        } else if (transcript.includes("intro") || transcript.includes("introduction")) {
          speak("Showing introduction.");
          loadSection("intro");
        } else {
          speak("You said: " + transcript + ". Try saying voice integration, API, or examples.");
        }
      };

      rec.onend = () => btn.classList.remove("listening");
      rec.onerror = () => btn.classList.remove("listening");

      function speak(text) {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.pitch = 1;
        utter.rate = 1.1;
        
        if (availableVoices.length > 0) {
          utter.voice = availableVoices[0];
        }
        synth.speak(utter);
      }

      btn.onclick = () => {
        btn.classList.add("listening");
        rec.start();
      };
    } else {
      btn.onclick = () => alert("Web Speech API is not supported in this browser.");
    }
  </script>
</body>
</html>
